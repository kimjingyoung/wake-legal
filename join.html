<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wake 초대</title>
<link rel="stylesheet" href="style.css">
<style>
.code { font-size: 56px; font-weight: 900; letter-spacing: 6px; color: var(--accent); margin: 8px 0 4px; }
.btn { display:block; text-align:center; background:var(--accent); color:var(--bg); font-weight:800; font-size:20px; padding:18px; border-radius:20px; text-decoration:none; margin:18px 0 10px; }
.btn.sub { background:var(--card); color:var(--fg); border:1px solid var(--line); font-size:16px; }
.small { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
<div class="logo">Wake</div>
<h1>친구가 그룹에 초대했어요</h1>
<p class="meta">무음이어도 친구가 깨워주는 알람</p>
<div class="box">
  <div class="small">초대 코드</div>
  <div class="code" id="code">------</div>
  <div class="small" id="expire">24시간 안에 쓸 수 있어요</div>
  <a class="btn" id="open" href="#">Wake 앱에서 참여하기</a>
  <a class="btn sub" id="ios" href="#" style="display:none">App Store에서 받기</a>
  <a class="btn sub" id="android" href="https://bwgfwsfkfqqlgqalteer.supabase.co/storage/v1/object/public/builds/wake.apk" style="display:none">Android 앱 받기</a>
  <p class="small">앱을 이미 받았으면 위 버튼이 앱을 열어요. 안 열리면 앱을 실행하고 <b>초대 코드 입력</b>에 위 숫자를 넣어주세요.</p>
</div>
<p class="small"><a href="terms.html">이용약관</a> · <a href="privacy.html">개인정보처리방침</a></p>
<script>
  const code = (new URLSearchParams(location.search).get("code") || "").replace(/[^0-9]/g, "").slice(0, 6);
  document.getElementById("code").textContent = code || "------";
  const open = document.getElementById("open");
  open.href = "wake://join?code=" + code;
  const ua = navigator.userAgent;
  if (/iPhone|iPad/.test(ua)) document.getElementById("ios").style.display = "block";
  else if (/Android/.test(ua)) document.getElementById("android").style.display = "block";
  // 앱이 없으면 2초 뒤 스토어 안내가 남는다
  open.addEventListener("click", () => { setTimeout(() => { document.getElementById(/iPhone|iPad/.test(ua) ? "ios" : "android").style.display = "block"; }, 2000); });
</script>
</main>
</body>
</html>
